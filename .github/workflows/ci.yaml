# PR과 main 변경 시 Java 21 및 Docker가 있는 실행 환경에서 테스트합니다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      # Testcontainers가 실행 환경의 Docker로 PostgreSQL을 준비합니다.
      - name: Run tests
        run: ./gradlew clean test --no-daemon

      # 실패한 테스트를 확인할 수 있도록 HTML 보고서를 보관합니다.
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
