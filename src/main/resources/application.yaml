# 모든 환경에서 공유하는 설정입니다. 환경별 파일에서 필요한 값을 덮어씁니다.
spring:
  config:
    # 확장자가 없는 루트 .env를 properties 형식으로 읽습니다. 파일이 없어도 실행할 수 있습니다.
    import: optional:file:./.env[.properties]
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 2000
        delivery.timeout.ms: 8000
        request.timeout.ms: 3000
    admin:
      auto-create: false
  application:
    name: account-service
  profiles:
    default: local
    # .env의 대문자 키도 프로필 선택에 사용하고 실행 환경의 명시적 프로필을 우선합니다.
    active: ${SPRING_PROFILES_ACTIVE:local}
  # 탈퇴 확인 내부 호출 장애 대응입니다. 상태 확인으로 죽은 인스턴스를 목록에서 미리 빼고, 연결 자체가 실패한 요청만 다른 인스턴스로 1회
  # 재시도합니다. 연결 실패는 요청이 상대에 도달하지 않은 경우라 차단 등록(POST)도 중복 없이 재시도할 수 있습니다.
  cloud:
    loadbalancer:
      configurations: health-check
      health-check:
        # 메일·DB 같은 외부 연결 검사가 들어간 /actuator/health 대신 인스턴스 기동 여부만 보는 readiness를 씁니다.
        # 전체 health를 10초마다 호출하면 Account의 메일 검사가 SMTP에 반복 로그인해 차단되고 인스턴스가 통째로 제외됩니다.
        path:
          default: /actuator/health/readiness
        interval: 10s
        refetch-instances: true
        refetch-instances-interval: 30s
      retry:
        enabled: true
        retry-on-all-operations: true
        max-retries-on-same-service-instance: 0
        max-retries-on-next-service-instance: 1
        retryable-exceptions: java.net.ConnectException, java.net.http.HttpConnectTimeoutException
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      # PDF는 5MB, JSON을 포함한 전체 요청은 6MB까지 허용합니다.
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    # 컨트롤러에서 지연 로딩하지 않도록 DB 접근을 서비스 트랜잭션 안으로 제한합니다.
    open-in-view: false
    properties:
      hibernate:
        default_schema: account
        jdbc:
          time_zone: UTC
  # 스키마 관리 도구 설정입니다. 개발 DDL 자동 갱신 정책은 local 파일에 있습니다.
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: account
    schemas: account
    create-schemas: true

# 초기 개발 정책입니다. 운영에서 요구하는 값은 환경별로 조정할 수 있습니다.
account:
  outbox:
    publisher-enabled: ${ACCOUNT_OUTBOX_PUBLISHER_ENABLED:false}
  withdrawal:
    enabled: ${ACCOUNT_WITHDRAWAL_ENABLED:false}
  service-auth:
    # 원문 비밀값은 Order만 보유하고 Account에는 기존 BCrypt 인코더의 해시만 공급합니다.
    enabled: ${ACCOUNT_SERVICE_AUTH_ENABLED:false}
    token-ttl: 5m
    clients:
      order-command-service:
        subject: ${ORDER_SERVICE_SUBJECT:}
        secret-hash: ${ORDER_SERVICE_SECRET_HASH:}
        scopes: product.stock
  seller:
    max-certificate-bytes: 5242880
    data-encryption-key: ${SELLER_DATA_ENCRYPTION_KEY:}
    storage:
      bucket: ${SELLER_CERTIFICATE_BUCKET:stockdrop-account-certificates}
      region: ap-northeast-2
      endpoint: ""
      path-style: false
      auto-create-bucket: false
      access-key: ""
      secret-key: ""
  admin:
    bootstrap-enabled: false
  auth:
    # 초기 인증 정책이며 운영 issuer와 허용 프론트 주소는 배포 환경에서 지정합니다.
    issuer: ${JWT_ISSUER:http://localhost:8080}
    audience: stockdrop-api
    access-ttl: 15m
    refresh-ttl: 14d
    max-login-failures: 10
    login-window: 15m
    signing-key-location: ${JWT_SIGNING_KEY_LOCATION:}
    cookie-secure: false
    cookie-same-site: Lax
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    cleanup:
      # 세션의 원래 만료 시각부터 7일 보관한 뒤 한국 시간 새벽 4시에 정리합니다.
      enabled: true
      retention: 7d
      cron: "0 0 4 * * *"
      batch-size: 100
      max-batches: 100
  email-verification:
    code-ttl: 5m
    proof-ttl: 15m
    resend-interval: 60s
    max-attempts: 5
    max-requests-per-hour: 10
    from: ${MAIL_FROM:no-reply@stockdrop.local}

server:
  shutdown: graceful

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# 업무 JWT와 분리된 읽기 전용 수집 토큰입니다. 빈 값이면 메트릭 접근을 거부합니다.
monitoring:
  scrape-token: ${MONITORING_SCRAPE_TOKEN:}

  # Outbox 집계 스케줄은 명시 활성화하며 테스트/미설정 환경에서 DB를 주기 조회하지 않습니다.
  outbox-enabled: ${MONITORING_OUTBOX_ENABLED:false}
